name: Release workflow checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release preparation and publication safeguards
        run: python3 -m unittest discover -s tools/releases/tests -v
      - name: Check shared version configuration
        run: python3 tools/releases/release.py check-source
